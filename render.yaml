services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 1. Backend API Service (Node.js + Express)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: web
    name: emobility-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:prod
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://emobility-admin.onrender.com
      - key: ADMIN_FRONTEND_URL
        value: https://emobility-admin.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://emobility-admin.onrender.com
      # Database - Neon PostgreSQL. Paste the connection string in the
      # Render dashboard when prompted. Never commit it to this file.
      - key: DATABASE_URL
        sync: false
      # SMTP - Fill these in Render dashboard manually (sensitive)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Encryption keys - must be 64-char hex strings.
      # Generate each with: openssl rand -hex 32
      # Keep them unchanged after first deploy, or encrypted data becomes unreadable.
      - key: ENCRYPTION_KEY
        sync: false
      - key: EMAIL_HASH_KEY
        sync: false
      # Super Admin
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 2. AI Traffic Server (Python + Flask + YOLOv8)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: web
    name: emobility-ai-server
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python ai_traffic_server.py
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: "3.11"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 3. Frontend Static Site (React + Vite)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: web
    name: emobility-admin
    runtime: static
    rootDir: e-mobility-admin
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://emobility-backend.onrender.com/api
      - key: VITE_AI_SERVER_URL
        value: https://emobility-ai-server.onrender.com
      - key: VITE_WS_URL
        value: wss://emobility-ai-server.onrender.com/ws/live

# Database: hosted on Neon (external), so no `databases:` block is needed.
